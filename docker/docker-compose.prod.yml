services:
  # --- 1. DATABASE ---
  db:
    image: postgres:16-alpine
    container_name: smart_uni_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-residence_connectee_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d residence_connectee_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart_network

  # --- 2. DJANGO API (GUNICORN) ---
  web:
    image: mohamine2/smart-uni-api:latest
    container_name: smart_uni_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-residence_connectee_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart_network

  # --- 3. NGINX SERVER (REVERSE PROXY) ---
  nginx:
    image: nginx:latest
    container_name: smart_uni_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - web
    networks:
      - smart_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  smart_network:
    driver: bridge
