name: CD Pipeline - Deploy to AWS EC2

on:
  repository_dispatch:
    types: [deploy-api]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Execute Deployment Commands via AWS SSM
        run: |
          BASE64_COMPOSE=$(base64 -w 0 docker/docker-compose.prod.yml)
          BASE64_ENV=$(echo "${{ secrets.ENV_FILE_CONTENT }}" | base64 -w 0)
          BASE64_NGINX=$(base64 -w 0 docker/nginx/default.conf)
          
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=smart-uni-server" \
            --comment "Automated deployment triggered by smart-uni-api" \
            --parameters "commands=[
              \"mkdir -p /home/ubuntu/smart-uni/docker/nginx\",
              \"cd /home/ubuntu/smart-uni\",
              \"echo '$BASE64_COMPOSE' | base64 -d > docker-compose.yml\",
              \"echo '$BASE64_ENV' | base64 -d > .env\",
              \"echo '$BASE64_NGINX' | base64 -d > docker/nginx/default.conf\",
              \"docker compose pull\",
              \"docker compose up -d --remove-orphans --force-recreate\",
              \"docker image prune -f\",
              \"docker compose exec -T web python manage.py migrate --noinput\"
            ]"
